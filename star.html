<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Светящиеся частицы</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .particles {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas class="particles" aria-hidden="true"></canvas>
    <script>
      const canvas = document.querySelector(".particles");
      const context = canvas.getContext("2d");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const isMobile = window.matchMedia("(max-width: 700px), (pointer: coarse)");
      const particles = [];
      const particleOrigin = localStorage.getItem("particle-origin") === "left" ? "left" : "right";
      const direction = particleOrigin === "left" ? 1 : -1;
      let width = 0;
      let height = 0;
      let previousTime = 0;
      let emissionRemainder = 0;
      let animationFrame = 0;
      let glowGradient;
      let edgeGradient;

      localStorage.setItem("particle-origin", particleOrigin === "left" ? "right" : "left");

      function createParticle() {
        const lifetime = 1.2 + Math.random() * 2.1;
        return {
          x: particleOrigin === "right" ? width + Math.random() * 5 : -Math.random() * 5,
          y: Math.random() * height,
          vx: direction * (prefersReducedMotion.matches ? 70 + Math.random() * 100 : 150 + Math.random() * 300),
          vy: (Math.random() - 0.5) * (prefersReducedMotion.matches ? 24 : 70),
          size: 1 + Math.random() * 2.5,
          age: 0,
          lifetime
        };
      }

      function emitParticles(count) {
        for (let i = 0; i < count; i += 1) {
          particles.push(createParticle());
        }
      }

      function resize() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, isMobile.matches ? 1 : 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        particles.length = 0;
        emitParticles(Math.min(isMobile.matches ? 16 : 32, Math.ceil(height / (isMobile.matches ? 48 : 24))));
        const edgeX = particleOrigin === "right" ? width : 0;
        glowGradient = context.createRadialGradient(edgeX, height / 2, 0, edgeX, height / 2, Math.min(width * 0.38, 420));
        glowGradient.addColorStop(0, "rgba(36, 255, 18, 0.2)");
        glowGradient.addColorStop(0.18, "rgba(36, 255, 18, 0.07)");
        glowGradient.addColorStop(1, "rgba(36, 255, 18, 0)");
        edgeGradient = context.createLinearGradient(edgeX, 0, edgeX - direction * 3, 0);
        edgeGradient.addColorStop(0, "rgba(57, 255, 20, 0)");
        edgeGradient.addColorStop(1, "rgba(57, 255, 20, 0.7)");
        draw(0, false);
      }

      function drawEdgeGlow() {
        context.fillStyle = glowGradient;
        context.fillRect(0, 0, width, height);

        context.fillStyle = edgeGradient;
        context.fillRect(particleOrigin === "right" ? width - 3 : 0, 0, 3, height);
      }

      function draw(delta, animate = true) {
        context.clearRect(0, 0, width, height);
        drawEdgeGlow();
        if (animate) {
          const emissionRate = isMobile.matches
            ? (prefersReducedMotion.matches ? 6 : 14)
            : (prefersReducedMotion.matches ? 12 : 48);
          emissionRemainder += delta * emissionRate;
          const count = Math.floor(emissionRemainder);
          emissionRemainder -= count;
          const maxParticles = isMobile.matches ? 55 : 180;
          emitParticles(Math.min(count, maxParticles - particles.length));
        }

        context.save();
        context.globalCompositeOperation = "lighter";
        const paths = Array.from({ length: 3 }, () => ({ trails: new Path2D(), dots: new Path2D() }));
        const activeParticles = [];
        for (const particle of particles) {
          if (animate) {
            particle.x += particle.vx * delta;
            particle.y += particle.vy * delta;
            particle.age += delta;
          }

          if (particle.age >= particle.lifetime || particle.y < -10 || particle.y > height + 10) {
            continue;
          }

          const lifeProgress = particle.age / particle.lifetime;
          const opacity = Math.sin(lifeProgress * Math.PI) * 0.9;
          const path = paths[Math.min(2, Math.floor(opacity * 3))];
          const tailLength = Math.min(24, Math.abs(particle.vx) * 0.07);
          path.trails.moveTo(particle.x, particle.y);
          path.trails.lineTo(particle.x - direction * tailLength, particle.y);
          path.dots.moveTo(particle.x + particle.size * 0.65, particle.y);
          path.dots.arc(particle.x, particle.y, particle.size * 0.65, 0, Math.PI * 2);
          activeParticles.push(particle);
        }

        particles.length = 0;
        particles.push(...activeParticles);
        context.lineWidth = isMobile.matches ? 1.5 : 2;
        for (let i = 0; i < paths.length; i += 1) {
          context.strokeStyle = `rgba(57, 255, 20, ${(i + 1) / 3})`;
          context.fillStyle = `rgba(190, 255, 175, ${(i + 1) / 3})`;
          context.stroke(paths[i].trails);
          context.fill(paths[i].dots);
        }
        context.restore();
      }

      function animate(time) {
        const delta = Math.min((time - previousTime) / 1000, 0.05);
        previousTime = time;
        draw(delta);
        animationFrame = window.requestAnimationFrame(animate);
      }

      function updateMotionPreference() {
        window.cancelAnimationFrame(animationFrame);
        previousTime = performance.now();
        animationFrame = window.requestAnimationFrame(animate);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", resize);
      isMobile.addEventListener("change", resize);
      prefersReducedMotion.addEventListener("change", updateMotionPreference);
      document.addEventListener("visibilitychange", () => {
        window.cancelAnimationFrame(animationFrame);
        if (!document.hidden) {
          previousTime = performance.now();
          animationFrame = window.requestAnimationFrame(animate);
        }
      });
      resize();
      updateMotionPreference();
    </script>
  </body>
</html>
