<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Светящиеся частицы</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .particles {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas class="particles" aria-hidden="true"></canvas>
    <script>
      const canvas = document.querySelector(".particles");
      const context = canvas.getContext("2d");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const particles = [];
      const particleOrigin = localStorage.getItem("particle-origin") === "left" ? "left" : "right";
      const direction = particleOrigin === "left" ? 1 : -1;
      let width = 0;
      let height = 0;
      let previousTime = 0;
      let emissionRemainder = 0;
      let animationFrame = 0;

      localStorage.setItem("particle-origin", particleOrigin === "left" ? "right" : "left");

      function createParticle() {
        const lifetime = 1.2 + Math.random() * 2.1;
        return {
          x: particleOrigin === "right" ? width + Math.random() * 5 : -Math.random() * 5,
          y: Math.random() * height,
          vx: direction * (prefersReducedMotion.matches ? 70 + Math.random() * 100 : 150 + Math.random() * 300),
          vy: (Math.random() - 0.5) * (prefersReducedMotion.matches ? 24 : 70),
          size: 1 + Math.random() * 2.5,
          age: 0,
          lifetime
        };
      }

      function emitParticles(count) {
        for (let i = 0; i < count; i += 1) {
          particles.push(createParticle());
        }
      }

      function resize() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        particles.length = 0;
        emitParticles(Math.min(45, Math.ceil(height / 18)));
        draw(0, false);
      }

      function drawEdgeGlow() {
        const edgeX = particleOrigin === "right" ? width : 0;
        const glow = context.createRadialGradient(edgeX, height / 2, 0, edgeX, height / 2, Math.min(width * 0.38, 420));
        glow.addColorStop(0, "rgba(36, 255, 18, 0.2)");
        glow.addColorStop(0.18, "rgba(36, 255, 18, 0.07)");
        glow.addColorStop(1, "rgba(36, 255, 18, 0)");
        context.fillStyle = glow;
        context.fillRect(0, 0, width, height);

        const edge = context.createLinearGradient(edgeX, 0, edgeX - direction * 3, 0);
        edge.addColorStop(0, "rgba(57, 255, 20, 0)");
        edge.addColorStop(1, "rgba(57, 255, 20, 0.7)");
        context.fillStyle = edge;
        context.fillRect(particleOrigin === "right" ? width - 3 : 0, 0, 3, height);
      }

      function draw(delta, animate = true) {
        context.clearRect(0, 0, width, height);
        drawEdgeGlow();
        if (animate) {
          emissionRemainder += delta * (prefersReducedMotion.matches ? 12 : 48);
          const count = Math.floor(emissionRemainder);
          emissionRemainder -= count;
          emitParticles(count);
        }

        context.save();
        context.globalCompositeOperation = "lighter";
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          if (animate) {
            particle.x += particle.vx * delta;
            particle.y += particle.vy * delta;
            particle.age += delta;
          }

          if (particle.age >= particle.lifetime || particle.y < -10 || particle.y > height + 10) {
            particles.splice(i, 1);
            continue;
          }

          const lifeProgress = particle.age / particle.lifetime;
          const opacity = Math.sin(lifeProgress * Math.PI) * 0.9;
          const tailLength = Math.min(24, Math.abs(particle.vx) * 0.07);
          const gradient = context.createLinearGradient(particle.x, particle.y, particle.x - direction * tailLength, particle.y);
          gradient.addColorStop(0, `rgba(57, 255, 20, ${opacity})`);
          gradient.addColorStop(1, "rgba(57, 255, 20, 0)");
          context.strokeStyle = gradient;
          context.lineWidth = particle.size;
          context.beginPath();
          context.moveTo(particle.x, particle.y);
          context.lineTo(particle.x - direction * tailLength, particle.y);
          context.stroke();

          context.shadowColor = "#39ff14";
          context.shadowBlur = particle.size * 7;
          context.fillStyle = `rgba(190, 255, 175, ${opacity})`;
          context.beginPath();
          context.arc(particle.x, particle.y, particle.size * 0.65, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }

      function animate(time) {
        const delta = Math.min((time - previousTime) / 1000, 0.05);
        previousTime = time;
        draw(delta);
        animationFrame = window.requestAnimationFrame(animate);
      }

      function updateMotionPreference() {
        window.cancelAnimationFrame(animationFrame);
        previousTime = performance.now();
        animationFrame = window.requestAnimationFrame(animate);
      }

      window.addEventListener("resize", resize);
      prefersReducedMotion.addEventListener("change", updateMotionPreference);
      resize();
      updateMotionPreference();
    </script>
  </body>
</html>
